<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hours Apart — the world clock that shows whether it is light there">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c14e"/>
      <stop offset="0.42" stop-color="#e39a4d"/>
      <stop offset="0.7" stop-color="#b06a49"/>
      <stop offset="1" stop-color="#2c3766"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#fdfcf8"/>
  <rect x="0" y="0" width="1200" height="16" fill="url(#sky)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="88" y="258" font-size="96" font-weight="600" letter-spacing="-3" fill="#2b2a26">Hours Apart</text>
    <text x="90" y="332" font-size="40" font-weight="500" fill="#4a463f">The world clock that shows whether it&#8217;s light there.</text>
    <text x="90" y="392" font-size="30" font-weight="400" fill="#6b6558">And warns you before daylight saving shifts a recurring meeting.</text>
    <text x="90" y="566" font-size="27" font-weight="500" fill="#8a8271">hoursapart.app</text>
  </g>

  <rect x="90" y="468" width="1020" height="56" rx="12" fill="url(#sky)"/>
</svg>
